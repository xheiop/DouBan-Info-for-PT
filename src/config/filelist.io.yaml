url: 'https://filelist.io'
host: filelist.io
siteName: FL
imdb: '.cblock-innercontent div a[href*="imdb.com/title"]:first'
titleDom: '.cblock-header h4'
addTitleBefore: '.cblock-innercontent span[style*="padding-left:25px"]'
addTitleHtml: '<a class="douban-title-link douban-title-fl" href="{link}" target="_blank" rel="noreferrer" title="{title}">{title}</a>'
replaceOverview: '.cblock-innercontent span[style*="padding-left:25px"]'
replaceRating: '.cblock-innercontent span:has(img[src*="starbig"])'
replaceRatingPosition: 'before'
ratingSourceLabel: 'IMDb'
replaceRatingHtml: '<span style="font-size:18px;float:right;margin-right:12px;"><img src="/styles/images/starbig.png" alt="豆瓣评分" style="position:relative;bottom:2px;"> 豆瓣 {score}</span>'
addLinkButtonAfter: '.cblock-innercontent a:has(img[src*="imdb.png"])'
addLinkButtonHtml: ' <a href="{link}" target="_blank" rel="noreferrer"><img src="data:image/png;base64," alt="Douban" title="Douban"></a>'
listPage:
  path: '^/browse\.php$'
  titleLink: '.torrentrow a[href*="details.php?id="]'
  row: 'div.torrentrow'
  idPattern: '[?&]id=(\d+)'
  # 标题被截断显示，完整发行名在链接的 title 属性里
  titleAttr: 'title'
  popupTheme: 'card'
