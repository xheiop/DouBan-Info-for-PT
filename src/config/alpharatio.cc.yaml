url: 'https://alpharatio.cc'
host: alpharatio.cc
siteName: AR
imdb: 'a[href*="imdb.com/title"]'
titleDom: 'span.size6'
addTitleAfter: 'span.size6'
addTitleHtml: '<br><a class="douban-title-link douban-title-ar" style="color:#008000;" href="{link}" target="_blank" rel="noreferrer" title="{title}"><span class="size6">{title}</span></a>'
replaceOverviewLabel: 'PLOT'
addLinkButtonAfter: 'a[href*="themoviedb.org"]'
addLinkButtonHtml: ' <a rel="noreferrer" target="_blank" href="{link}"><img class="scale_image" src="data:image/png;base64," alt="Douban" title="Douban"></a>'
listPage:
  path: '^/torrents\.php$'
  # 列表页与影片组详情页同走 torrents.php，详情页带 id= 编号，排除它走详情页流程
  excludeQuery: '[?&]id='
  titleLink: 'a[href*="torrentid="]'
  row: 'tr.torrent'
  # View Torrent 链接是 torrents.php?id={影片组}&torrentid={种子}，两个编号：
  # torrentid 才是单条种子，同一影片的各个压制版本各不相同；id 是影片组编号，
  # 所有版本共用它。按 torrentid 分组才能给每个版本都插片名，取不到再退回组编号
  idPattern:
    - '[?&]torrentid=(\d+)'
    - '[?&]id=(\d+)'
  # IMDb 编号在行的标签链接里（taglist=tt0763840），行内没有 imdb.com 链接
  imdbTagPattern: 'taglist=(tt\d+)'
  popupTheme: 'card'
