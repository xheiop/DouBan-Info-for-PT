url: 'http://shadowthein.net'
host: shadowthein.net
siteName: iTS
imdb: '.IMDBtable a[href*="imdb.com/title"]:first'
titleDom: 'h1:first'
addTitleAfter: '.IMDBtable tr:has(td:contains("Title:")) b'
addTitleHtml: ' <a class="douban-title-link" style="color:inherit;font-weight:bold;" href="{link}" target="_blank" rel="noreferrer" title="{title}">{title}</a>{year}'
addTitleYearFrom: '.IMDBtable tr:has(td:contains("Released:")) td + td'
replaceRating: '.IMDBtable tr:has(td:contains("Rating:"))'
replaceRatingPosition: 'after'
renameRatingLabel: 'IMDB Rating:'
replaceRatingHtml: '<tr><td>DouBan Rating:</td><td><a href="{link}" target="_blank" rel="noreferrer" title="豆瓣评分 {votes}人评价" style="color:darkorange">{score}</a></td></tr>'
replaceOverview: '.IMDBtable tr:has(td:contains("Plot:")) > td + td'
addLinkButtonAfter: '.IMDBtable tr:has(td:contains("Link:")) a'
addLinkButtonHtml: ' <a href="redir.php?{link}" style="color:darkorange">{link}</a>'
listPage:
  path: '^/browse\.php$'
  titleLink: 'a[href*="/details.php?id="]'
  row: 'tr'
  idPattern: '[?&]id=(\d+)'
  # 标题被截断显示，完整发行名在链接的 output 属性里
  titleAttr: 'output'
  popupTheme: 'card'
