url: 'https://blutopia.cc'
host: blutopia.cc
siteName: BLU
imdb: '.meta__imdb a[href*="imdb.com/title"]:nth-child(1)'
titleDom: '.torrent__name'
addTitleInside: 'h1.meta__title'
addTitleHtml: '<a class="douban-title-link douban-title-blu" href="{link}" target="_blank" rel="noreferrer" title="{title}">{title}</a>'
replaceOverview: 'p.meta__description'
replaceRating: 'li.work__rating'
replaceRatingHtml: '<li class="work__rating"><a href="{link}" target="_blank" rel="noreferrer" title="豆瓣评分 {votes}人评价"><span class="work__rating-text">豆瓣 {score}</span></a></li>'
addLinkButtonAfter: 'ul.meta__ids li.meta__imdb'
addLinkButtonHtml: '<li class="meta__douban"><a class="meta-id-tag" href="{link}" title="Douban" target="_blank" rel="noreferrer"><img src="data:image/png;base64," alt="Douban" title="Douban"></a></li>'
