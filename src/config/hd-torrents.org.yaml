url: 'https://hd-torrents.org'
host: hd-torrents.org
siteName: HDT
imdb: '.imdbnew2 a[href*="imdb.com/title"]:first'
addTitleAfter: '.imdbnew2 a[href*="imdb.com/title"]'
addTitleHtml: '<strong><font color="black"> <img src="data:image/png;base64," border="0"> </font></strong><a class="douban-title-link douban-title-hdt" href="{link}" target="_blank" rel="noreferrer" title="{title}"><font size="3"><b>{title}</b></font></a>'
replaceOverviewLabel: 'Plot:'
replaceRating: '.imdbnew2 img[src*="ratings/"]'
ratingRewriteHtml: '<strong><font color="black">IMDB：</font></strong>{siteScore}/10<strong><font color="black">（Votes: {siteVotesComma}）</font></strong>'
removeRatingVotes: '.imdbnew2 strong:has(> font:contains("Votes"))'
replaceRatingHtml: '<br><strong><font color="black">豆瓣: </font></strong>{score}/10 <strong><font color="black">（Votes: {votesComma}）</font></strong>'
listPage:
  path: '^/torrents\.php$'
  titleLink: 'a[href*="details.php?id="]'
  row: 'tr'
  idPattern: 'id=([0-9a-f]{40})'
  popupTheme: 'card'
