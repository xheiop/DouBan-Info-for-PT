url: 'https://broadcasthe.net'
host: broadcasthe.net
siteName: BTN
imdb: '.stats td a[href*="imdb.com/title"]'
titleDom: 'h2:first'
addTitleLineAfter: 'img#banner'
addTitleLineHtml: '<div class="douban-title-line"><a class="douban-title-link" target="_blank" rel="noreferrer" href="{link}" title="{title}">{title} {nativeTitle}</a></div>'
addSummaryTab: '#tabs'
addSummaryTabIcon: 'data:image/png;base64,'
replaceRating: 'tr:has(b:contains("TVDB Rating"))'
replaceRatingHtml: '<tr><td><b>DouBan Rating:</b></td><td>{score}</td></tr>'
replaceRatingPosition: 'after'
addLinkButtonAfter: 'a[href*="thetvdb.com"]'
addLinkButtonHtml: ' <a target="_blank" rel="noreferrer" href="{link}"><img src="data:image/png;base64," border="0" width="16" height="16" alt="Douban" title="Douban"></a>'
listPage:
  path: '^/torrents\.php$'
  # 列表页与影片组详情页同走 torrents.php，详情页带 id= 编号，排除它走详情页流程：
  # 否则组页面会被列表逻辑占用——侧栏的 Season / S01E01 跳转链接被当成种子标题插片名，
  # 横幅下方的中文片名行、豆瓣评分行、简介 tab 反而都插不上
  excludeQuery: '[?&]id='
  titleLink: 'a[title="View Torrent"]'
  row: 'tr.torrent'
  # View Torrent 链接是 torrents.php?id={剧集组}&torrentid={种子}，两个编号:
  # torrentid 才是单条种子，同一集的所有压制版本各不相同；id 是剧集组编号，
  # 所有版本共用它。按 torrentid 分组才能给每个版本都插片名，取不到再退回组编号
  idPattern:
    - '[?&]torrentid=(\d+)'
    - '[?&]id=(\d+)'
  # 标题只显示剧集名与集数，完整发行名在 Release Name 那一行的 title 属性里
  releaseName: 'div.nobr span[title]'
  popupTheme: 'card'
